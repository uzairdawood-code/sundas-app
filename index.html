<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apologizing to Sundas</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.85; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-pink-50 to-red-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Top Title -->
    <div class="text-rose-900/60 text-xs sm:text-sm font-medium tracking-widest uppercase mb-6 flex items-center gap-2">
        <span>Apologizing to Sundas</span>
    </div>

    <!-- Main Card Container -->
    <div class="bg-white/80 backdrop-blur-md border border-rose-100 shadow-xl rounded-3xl p-8 sm:p-10 max-w-md w-full text-center relative overflow-hidden transition-all duration-500">
        
        <!-- Decorative Glow Background -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-rose-200/40 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-pink-200/40 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Heart Icon -->
        <div class="flex justify-center mb-5 text-rose-500">
            <svg class="w-10 h-10 animate-pulse-slow" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Heading -->
        <h1 class="serif-font text-3xl sm:text-4xl font-bold text-gray-800 mb-4 tracking-tight">
            I'm Sorry, Jan
        </h1>

        <!-- Message Body -->
        <p class="text-gray-600 text-sm sm:text-base leading-relaxed mb-8">
            Jan, I'm really sorry. I never wanted to hurt you. Please forgive me. ❤️
        </p>

        <!-- Action Button -->
        <button id="forgiveBtn" onclick="handleForgiveness()" class="w-full bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-medium py-3.5 px-6 rounded-full shadow-lg shadow-rose-600/30 transition-all duration-200 flex items-center justify-center gap-2">
            <span>Please forgive me</span>
        </button>

        <!-- Hidden Response Reveal Area -->
        <div id="responseBox" class="hidden mt-6 p-4 bg-rose-50/80 border border-rose-200 rounded-2xl text-rose-900 text-sm sm:text-base font-medium animate-fade-in">
            Thank you for reading, Jan. You mean a lot to me. ❤️
        </div>

        <!-- Footer Note -->
        <div class="mt-8 text-xs text-gray-400 tracking-wide">
            A little message, from the heart.
        </div>
    </div>

    <!-- Script to handle interactions and optional Telegram Alerts -->
    <script>
        function handleForgiveness() {
            const responseBox = document.getElementById('responseBox');
            const btn = document.getElementById('forgiveBtn');
            
            // Show the hidden response box
            responseBox.classList.remove('hidden');
            btn.innerText = "Thank you ❤️";
            btn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
            btn.classList.add('bg-emerald-600', 'cursor-default');
            btn.disabled = true;

            // Optional: If you want notifications pushed to your Telegram bot when she clicks it, 
            // you can uncomment and insert your Telegram Bot Token & Chat ID below:
            /*
            const botToken = "YOUR_BOT_TOKEN";
            const chatId = "YOUR_CHAT_ID";
            const text = encodeURIComponent("❤️ Sundas just clicked 'Please forgive me' on her app!");
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${text}`)
                .catch(err => console.log('Notification sent error', err));
            */
        }
    </script>
</body>
</html>
